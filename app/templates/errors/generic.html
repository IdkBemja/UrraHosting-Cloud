<!doctype html>
<html lang="es" data-theme="{{ theme_mode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} - {{ app_name }}</title>
  <link rel="icon" href="{{ favicon_url }}">
  <link rel="stylesheet" href="{{ url_for('theming.theme_css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <img class="brand-logo" src="{{ logo_url }}" alt="{{ app_name }}">
      <h1>{{ title }}</h1>
      <p class="auth-subtitle">{{ message }}</p>
      <footer class="app-footer">&copy; {{ current_year }} UrraHosting. Todos los derechos reservados.</footer>
    </div>
  </div>
</body>
</html>
