<!doctype html>
<html lang="es" data-theme="{{ theme_mode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contraseña requerida - {{ app_name }}</title>
  <link rel="icon" href="{{ favicon_url }}">
  <link rel="stylesheet" href="{{ url_for('theming.theme_css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <img class="brand-logo" src="{{ logo_url }}" alt="{{ app_name }}">
      <h1>Contenido protegido</h1>
      <p class="auth-subtitle">Este elemento compartido requiere una contraseña</p>
      {% if error %}<div class="alert error">Contraseña incorrecta</div>{% endif %}
      <form class="auth-form" method="post" action="{{ url_for('public.view_share', token=token, sub_path=sub_path) }}">
        {% include "_csrf.html" %}
        <input name="password" type="password" placeholder="Contraseña" required autofocus>
        <button class="btn login-btn" type="submit">Acceder</button>
      </form>
      <footer class="app-footer">&copy; {{ current_year }} UrraHosting. Todos los derechos reservados.</footer>
    </div>
  </div>
</body>
</html>
