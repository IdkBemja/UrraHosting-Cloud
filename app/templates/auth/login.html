<!doctype html>
<html lang="es" data-theme="{{ theme_mode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesion - {{ app_name }}</title>
  <link rel="icon" href="{{ favicon_url }}">
  <link rel="stylesheet" href="{{ url_for('theming.theme_css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <img class="brand-logo" src="{{ logo_url }}" alt="{{ app_name }}">
      <h1>{{ app_name }}</h1>
      <p class="auth-subtitle">Inicia sesion para continuar</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form class="auth-form" method="post">
        {% include "_csrf.html" %}
        <div>
          <label for="username">Usuario o email</label>
          <input id="username" name="username" type="text" required autofocus>
        </div>
        <div>
          <label for="password">Contrasena</label>
          <input id="password" name="password" type="password" required>
        </div>
        <button class="btn login-btn" type="submit">Iniciar sesion</button>
      </form>
    </div>
  </div>
</body>
</html>
