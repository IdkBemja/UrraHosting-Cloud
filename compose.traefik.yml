# Uso: docker compose -f compose.yml -f compose.traefik.yml up -d
# Requiere una red externa de Traefik (ver TRAEFIK_PUBLIC_NETWORK) igual
# que UrraHosting-WebPanel/GamePanel (ver plan.md seccion 6.3).
#
# Un solo dominio para toda la instancia:
#   Web app + API: https://storage-${INSTANCE_ID}.${PUBLIC_BASE_DOMAIN}/
#   WebDAV:        https://storage-${INSTANCE_ID}.${PUBLIC_BASE_DOMAIN}/dav/
#
# (Se evita un subdominio extra para WebDAV para no duplicar certificados
# ni complicar el flujo de dominio custom del cliente via TeamDomain.)

services:
  app:
    networks:
      - traefik-public
    # Labels como LISTA de strings, no mapa: Compose no interpola
    # variables dentro de claves de mapa YAML, solo dentro de valores.
    # Con `traefik.http.routers.storage-${INSTANCE_ID}...` como clave de
    # mapa, ${INSTANCE_ID} queda sin expandir en Traefik (bug ya
    # documentado y confirmado en UrraHosting-WebPanel/compose.traefik.yml).
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK}"
      - "traefik.http.routers.storage-${INSTANCE_ID}.rule=Host(`storage-${INSTANCE_ID}.${PUBLIC_BASE_DOMAIN}`)"
      - "traefik.http.routers.storage-${INSTANCE_ID}.entrypoints=${TRAEFIK_WEB_ENTRYPOINT}"
      - "traefik.http.routers.storage-${INSTANCE_ID}.tls=true"
      - "traefik.http.routers.storage-${INSTANCE_ID}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.storage-${INSTANCE_ID}.service=storage-${INSTANCE_ID}"
      - "traefik.http.services.storage-${INSTANCE_ID}.loadbalancer.server.port=${APP_PORT}"

  webdav:
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_PUBLIC_NETWORK}"
      - "traefik.http.routers.storage-${INSTANCE_ID}-dav.rule=Host(`storage-${INSTANCE_ID}.${PUBLIC_BASE_DOMAIN}`) && PathPrefix(`/dav`)"
      - "traefik.http.routers.storage-${INSTANCE_ID}-dav.entrypoints=${TRAEFIK_WEB_ENTRYPOINT}"
      - "traefik.http.routers.storage-${INSTANCE_ID}-dav.tls=true"
      - "traefik.http.routers.storage-${INSTANCE_ID}-dav.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.storage-${INSTANCE_ID}-dav.service=storage-${INSTANCE_ID}-dav"
      - "traefik.http.services.storage-${INSTANCE_ID}-dav.loadbalancer.server.port=${WEBDAV_PORT}"

networks:
  traefik-public:
    external: true
    name: ${TRAEFIK_PUBLIC_NETWORK}
